<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIFFJAMS</title>
<style>
  @font-face {
    font-family: "SBS Title";
    src: url("fonts/MetalMania-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: "Paranoid Title";
    src: url("fonts/BlackOpsOne-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; }
  body.home-mode { background: #0e0f12; color: #f3f3f1; }
  body.sheet-mode {
    background: #0b0d11;
    background-image:
      radial-gradient(ellipse 90% 60% at 50% 0%, #1a2030 0%, transparent 55%),
      radial-gradient(circle at 20% 80%, rgba(80,40,120,.12), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(120,20,30,.1), transparent 42%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 48px);
    color: #e8e6e1;
  }
  .wrap { width: 100%; padding: 10px 8px 28px; box-sizing: border-box; }
  h1 { margin: 0 0 10px 6px; font-size: 0.95rem; letter-spacing: .08em; text-transform: uppercase; color: #c2c2be; font-weight: 600; }
  .grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px; width: 100%; max-width: 920px;
  }
  .tile {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end;
    width: 100%; aspect-ratio: 1 / 1; height: auto; padding: 24px 28px; border: 0; border-radius: 14px;
    box-sizing: border-box; overflow: hidden;
    cursor: pointer; color: #fff; font-size: clamp(2rem, 8vw, 4.5rem); font-weight: 800;
    text-align: left; box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .tile small { font-size: 1rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
  .tile.a {
    background: #000 url("covers/sbs.png") center / cover no-repeat;
    color: transparent;
  }
  .tile.a small { color: transparent; }
  .tile.b {
    background: #000 url("covers/paranoid.png") center / cover no-repeat;
    color: transparent;
  }
  .tile.b small { color: transparent; }
  .tile.hp {
    background: #000 url("covers/sabbath-hp-tile.png") center / cover no-repeat;
    color: transparent;
  }
  .tile.hp small { color: transparent; }
  .tile.c { background: #ffe44a; color: #111; }
  .tile.d { background: #ff3d4e; }
  .tile:hover { filter: brightness(1.12); }
  .hidden { display: none !important; }
  .bar { display: flex; align-items: center; gap: 12px; margin: 0 0 12px 4px; }
  .back {
    background: transparent; color: inherit; border: 1px solid #bbb;
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  body.sheet-mode .back { border-color: #4a4e5a; color: #e8e6e1; }
  body.sheet-mode .count, body.sheet-mode .keys { opacity: .55; color: #c8c6c0; }
  body.sections-mode {
    background: #fff;
    background-image: none;
    color: #111;
  }
  body.sections-mode .back { border-color: #333; color: #111; }
  body.sections-mode .count, body.sections-mode .keys { opacity: .55; color: #444; }
  .badge { font-size: 1.15rem; font-weight: 800; padding: 4px 12px; border-radius: 8px; color: #111; }
  .badge.a { background: #3ec8ff; } .badge.b { background: #3ee45e; }
  .badge.c { background: #ffe44a; } .badge.d { background: #ff3d4e; }
  .count { opacity: .65; font-size: 0.9rem; }
  .keys { margin-left: auto; opacity: .5; font-size: 0.78rem; letter-spacing: .04em; }
  .phrase.filtered-out { display: none !important; }

  .sec-filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    margin: 0 0 12px; padding: 8px 10px;
    background: rgba(0,0,0,.03);
    border-radius: 10px;
    user-select: none;
  }
  .sec-filter-group {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  }
  .sec-filter-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: rgba(0,0,0,.38);
    margin-right: 2px;
  }
  .sec-filter-btn {
    border: 1px solid rgba(0,0,0,.12);
    background: #fff;
    color: #333;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.72rem; font-weight: 700;
    cursor: pointer;
    line-height: 1.3;
  }
  .sec-filter-btn:hover { border-color: rgba(112,48,160,.45); }
  .sec-filter-btn.on {
    background: #7030a0; color: #fff; border-color: #7030a0;
  }
  .sec-filter-btn.tier.on.t1 { background: #7030a0; border-color: #7030a0; }
  .sec-filter-btn.tier.on.t2 { background: #a365d1; border-color: #a365d1; }
  .sec-filter-btn.tier.on.t3 { background: #bc90da; border-color: #bc90da; color: #1a1020; }
  .sec-filter-btn.tier.on.t4 { background: #d4bbe3; border-color: #d4bbe3; color: #1a1020; }
  .sec-filter-btn.tier.on.t5 { background: #f3edf7; border-color: #c9b3d9; color: #1a1020; }
  .sec-filter-clear {
    margin-left: auto;
    border: 0; background: transparent;
    color: rgba(0,0,0,.45); font-size: 0.72rem; font-weight: 600;
    cursor: pointer; text-decoration: underline;
  }
  .sec-filter-clear:hover { color: #7030a0; }

  .sec-modes {
    display: flex; gap: 6px; align-items: center;
    margin: 0 0 10px;
  }
  .sec-mode-btn {
    border: 1px solid rgba(0,0,0,.14);
    background: #fff;
    color: rgba(0,0,0,.55);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.78rem; font-weight: 700;
    cursor: pointer;
  }
  .sec-mode-btn.on {
    background: #111; color: #fff; border-color: #111;
  }
  .sec-edit-tools {
    display: none;
    align-items: center;
    gap: 6px;
    margin-left: 8px;
  }
  body.sections-edit .sec-edit-tools {
    display: inline-flex;
  }
  .sec-edit-tools[hidden] { display: none !important; }
  body.sections-edit .sec-edit-tools:not([hidden]) {
    display: inline-flex;
  }
  .sec-tool-btn {
    border: 1px solid rgba(0,0,0,.14);
    background: #fff;
    color: rgba(0,0,0,.7);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.78rem; font-weight: 700;
    cursor: pointer;
  }
  .sec-tool-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .sec-tool-btn.primary {
    background: #7030a0;
    border-color: #7030a0;
    color: #fff;
  }
  .sec-tool-btn.primary.saved {
    background: #2e8b57;
    border-color: #2e8b57;
  }
  .sec-save-status {
    font-size: 0.72rem;
    font-weight: 600;
    color: rgba(0,0,0,.45);
    min-width: 4em;
  }
  body.sections-edit .sec-filters { opacity: .55; pointer-events: none; }

  body.sections-play .sec-filters { opacity: 1; }
  /* Song Map: map only (no right preview). Play queues to Playboard window. */
  body.sections-mode .sec-play-pane { display: none !important; }
  body.playboard-mode {
    background: #0a0a0c;
    margin: 0;
    min-height: 100vh;
  }
  body.playboard-mode .wrap {
    padding: 12px;
    max-width: none;
    width: 100%;
    box-sizing: border-box;
  }
  body.playboard-mode #playboardRoot {
    width: 100%;
    height: calc(100vh - 24px);
  }
  body.playboard-mode .sec-play-pane {
    display: flex !important;
    position: relative;
    top: 0;
    width: 100%;
    height: 100%;
    max-height: none;
    flex: 1 1 auto;
    border-radius: 12px;
  }
  .album-art-cell { display: none !important; }
  .sec-head-label.album { display: none !important; }
  body.sections-play #sectionsSheet {
    width: 100% !important;
    max-width: none !important;
    padding: 0 !important;
    align-items: stretch !important;
  }
  body.sections-play .sections-wrap {
    --grid-left: calc(var(--row-g) + var(--name-w) + var(--cols) * var(--chip-w));
    width: calc(var(--row-g) + var(--name-w) + var(--cols) * var(--chip-w));
    max-width: none;
    flex: 0 0 auto;
  }
  .sections-layout {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 8px;
    width: 100%;
    max-width: 100%;
  }
  .sections-layout .sections-wrap {
    flex: 0 0 auto;
  }
  body.sections-play .sections-layout {
    gap: 8px;
    width: 100%;
  }
  body.sections-play .sections-layout .sections-wrap {
    flex: 0 0 auto;
    width: calc(var(--row-g) + var(--name-w) + var(--cols) * var(--chip-w));
  }
  .sec-play-pane {
    display: none;
    position: sticky;
    top: 8px;
    flex: 1 1 0;
    min-width: 0;
    width: auto;
    height: calc(100vh - 110px);
    max-height: calc(100vh - 110px);
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    box-sizing: border-box;
    background: #0e0e10;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,.14);
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    overflow: hidden;
  }
  .sec-play-meta {
    flex: 0 0 auto;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    color: rgba(255,255,255,.65);
    letter-spacing: .02em;
  }
  .sec-play-meta strong { color: #fff; font-weight: 800; }
  .sec-play-board {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    align-items: flex-start;
    gap: 8px;
    overflow: hidden;
  }
  .sec-play-card {
    position: relative;
    flex: 0 0 auto;
    width: auto;
    max-width: none;
    min-width: 0;
    background: transparent;
    border: 0;
    overflow: visible;
    display: flex;
    flex-direction: column;
    padding: 16px 8px 14px;
    box-sizing: border-box;
    cursor: pointer;
  }
  .sec-play-card:hover .face { filter: brightness(1.03); }
  .sec-play-card:active .face { transform: scale(0.99); }
  .sec-play-card .face {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 0 6px 1px rgba(163,73,164,.95),
      0 0 18px 4px rgba(163,73,164,.7),
      0 0 40px 10px rgba(163,73,164,.4);
  }
  .sec-play-card.tier-1 .face {
    box-shadow:
      0 0 6px 1px rgba(112,48,160,.95),
      0 0 18px 4px rgba(112,48,160,.7),
      0 0 40px 10px rgba(112,48,160,.4);
  }
  .sec-play-card.tier-2 .face {
    box-shadow:
      0 0 6px 1px rgba(163,101,209,.95),
      0 0 18px 4px rgba(163,101,209,.7),
      0 0 40px 10px rgba(163,101,209,.4);
  }
  .sec-play-card.tier-3 .face {
    box-shadow:
      0 0 6px 1px rgba(188,144,218,.9),
      0 0 18px 4px rgba(188,144,218,.6),
      0 0 40px 10px rgba(188,144,218,.35);
  }
  .sec-play-card.tier-4 .face {
    box-shadow:
      0 0 6px 1px rgba(212,187,227,.85),
      0 0 18px 4px rgba(212,187,227,.55),
      0 0 40px 10px rgba(212,187,227,.3);
  }
  .sec-play-card.tier-5 .face {
    box-shadow:
      0 0 6px 1px rgba(243,237,247,.9),
      0 0 18px 4px rgba(200,180,220,.5),
      0 0 40px 10px rgba(160,140,190,.25);
  }
  .sec-play-card img {
    width: auto;
    height: auto;
    max-width: none;
    max-height: none;
    object-fit: contain;
    background: #fff;
    display: block;
    border-radius: 10px;
    image-rendering: crisp-edges;
  }
  .sec-play-card .ref {
    position: absolute;
    top: 8px; left: 10px;
    z-index: 2;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(0,0,0,.72);
    color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: .04em;
    pointer-events: none;
  }
  .sec-play-card .cap {
    margin-top: 6px;
    font-size: 0.68rem;
    font-weight: 700;
    color: rgba(255,255,255,.7);
    text-align: center;
  }
  .sec-play-empty {
    color: rgba(255,255,255,.45);
    font-size: 0.85rem;
    line-height: 1.4;
    padding: 24px 8px;
    text-align: center;
    width: 100%;
  }
  .sec-chip.playing {
    outline: 2px solid #111;
    outline-offset: -2px;
    box-shadow: inset 0 0 0 2px #ed1c24 !important;
  }
  .sec-chip.playing-offscreen {
    outline: 2px dashed rgba(0,0,0,.35);
    outline-offset: -2px;
    box-shadow: inset 0 0 0 2px rgba(237,28,36,.45) !important;
  }
  .phrase.playing {
    outline: 2px solid #ed1c24;
    outline-offset: 2px;
  }
  .phrase.playing-offscreen {
    outline: 2px dashed rgba(237,28,36,.45);
    outline-offset: 2px;
  }
  .sheet.has-lib-preview {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
    overflow-x: hidden; /* clip 200%-width strip before 50% scale */
  }
  .sheet.has-lib-preview .tab-wrap {
    order: 0;
    gap: 8px;
    align-items: flex-start;
    transform-origin: top left;
  }
  .sheet.has-lib-preview .tab-wrap .phrase.playing {
    outline: 2px solid #ed1c24;
    outline-offset: 2px;
  }
  .lib-preview {
    order: 1;
    flex: 1 1 auto;
    min-height: 0;
    background: #0e0e10;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .lib-preview.hidden { display: none !important; }
  .lib-preview-meta {
    flex: 0 0 auto;
    color: rgba(255,255,255,.8);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .lib-preview-board {
    flex: 1 1 auto;
    min-height: 120px;
    max-height: calc(100vh - 200px);
    overflow: auto;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    align-items: flex-start;
    gap: 10px;
  }
  .lib-preview-card {
    flex: 0 0 auto;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 0 6px 1px rgba(237,28,36,.85), 0 0 18px 4px rgba(237,28,36,.45);
  }
  .lib-preview-card img {
    display: block;
    width: auto;
    height: auto;
    max-width: none;
    max-height: none;
  }
  .lib-preview-card .cap {
    background: rgba(0,0,0,.72);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 8px;
  }


  .exclude-dd {
    position: relative;
    display: inline-block;
  }
  .exclude-dd-toggle {
    border: 1px solid rgba(0,0,0,.14);
    background: #fff;
    color: #333;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 72px;
    text-align: left;
  }
  .exclude-dd-toggle.has-excludes {
    background: #333;
    color: #fff;
    border-color: #333;
  }
  .exclude-dd-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 40;
    min-width: 140px;
    max-height: 240px;
    overflow: auto;
    background: #fff;
    border: 1px solid rgba(0,0,0,.14);
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,.16);
    padding: 6px;
  }
  .exclude-dd.open .exclude-dd-menu { display: block; }
  .exclude-dd-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    color: #222;
    cursor: pointer;
  }
  .exclude-dd-item:hover { background: rgba(0,0,0,.05); }
  .exclude-dd-item input { margin: 0; }
    .song-thumb {
    flex: 0 0 calc(var(--chip-h) - 6px);
    width: calc(var(--chip-h) - 6px);
    height: calc(var(--chip-h) - 6px);
    max-width: calc(var(--chip-h) - 6px);
    max-height: calc(var(--chip-h) - 6px);
    object-fit: cover;
    border-radius: 0;
    display: block;
    background: #111;
    margin: 3px 4px 3px 3px;
    box-sizing: border-box;
  }
  .song-name-wrap {
    display: flex;
    flex-direction: row;
    align-items: center;
    flex: 0 0 var(--name-w);
    width: var(--name-w);
    min-width: var(--name-w);
    max-width: var(--name-w);
    height: var(--chip-h);
    overflow: hidden;
    border-radius: 8px 0 0 8px;
    background: #fff;
  }
  .song-name-wrap.np-paranoid-wrap { background: #fff; }
  .song-name-wrap.np-sbs-wrap { background: #f3edf7; }
  .song-name-wrap.np-mor-wrap { background: #fff; }
  .song-name-wrap .song-name {
    flex: 1 1 auto;
    width: auto !important;
    min-width: 0 !important;
    max-width: none !important;
    border-radius: 0;
    height: 100%;
  }
  @media (max-width: 900px) {
    .sections-layout { flex-direction: column; }
    .sec-play-pane {
      position: relative;
      top: 0;
      width: 100%;
      height: 50vh;
      max-height: 50vh;
    }
  }
  body.sections-mode:not(.sections-edit):not(.sections-play) .sec-chip:not(.empty) { cursor: default; }
  body.sections-edit .sec-chip { cursor: pointer; }
  body.sections-edit .sec-chip:not(.empty) {
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body.sections-edit .sec-chip:not(.empty):active {
    cursor: grabbing;
  }
  .sec-chip.dragging {
    opacity: 0.35;
    pointer-events: none;
  }
  .sec-chip.drag-over {
    outline: 2px solid #7030a0 !important;
    outline-offset: -2px;
    box-shadow: inset 0 0 0 2px rgba(112,48,160,.25) !important;
  }
  .sec-chip.drag-over-empty {
    background: rgba(112,48,160,.12) !important;
  }
  body.sections-edit .sec-chip.empty {
    color: rgba(0,0,0,.2) !important;
    cursor: cell;
  }
  body.sections-edit .sec-chip.empty:hover {
    background: rgba(112,48,160,.08) !important;
  }
  body.sections-edit .sec-chip:not(.empty):hover {
    outline: 2px solid #7030a0; outline-offset: -2px;
  }
  .chip-editor {
    position: fixed; z-index: 80;
    min-width: 220px;
    background: #fff;
    border: 1px solid rgba(0,0,0,.12);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
    padding: 12px;
    display: none;
  }
  .chip-editor.open { display: block; }
  .chip-editor label {
    display: block; font-size: 0.68rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: rgba(0,0,0,.4); margin: 0 0 4px;
  }
  .chip-editor input[type="text"] {
    width: 100%; box-sizing: border-box;
    border: 1px solid rgba(0,0,0,.18);
    border-radius: 8px; padding: 8px 10px;
    font-size: 1rem; font-weight: 700; margin-bottom: 10px;
  }
  .chip-editor .tier-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .chip-editor .tier-pick {
    width: 32px; height: 28px; border: 0; border-radius: 6px;
    cursor: pointer; font-size: 0.7rem; font-weight: 800;
  }
  .chip-editor .tier-pick.t1 { background: #7030a0; color: #fff; }
  .chip-editor .tier-pick.t2 { background: #a365d1; color: #fff; }
  .chip-editor .tier-pick.t3 { background: #bc90da; color: #1a1020; }
  .chip-editor .tier-pick.t4 { background: #d4bbe3; color: #1a1020; }
  .chip-editor .tier-pick.t5 { background: #f3edf7; color: #1a1020; }
  .chip-editor .tier-pick.on { outline: 2px solid #111; outline-offset: 1px; }
  .chip-editor .editor-actions { display: flex; gap: 8px; align-items: center; }
  .chip-editor .editor-actions button {
    border: 0; border-radius: 8px; padding: 7px 12px;
    font-size: 0.78rem; font-weight: 700; cursor: pointer;
  }
  .chip-editor .btn-save { background: #7030a0; color: #fff; }
  .chip-editor .btn-cancel { background: #eee; color: #333; }
  .chip-editor .btn-copy { background: #f3eef8; color: #7030a0; }
  .chip-editor .btn-del { background: transparent; color: #c0392b; margin-left: auto; }
  /* Filtered chips stay as empty cells so grid lines remain */
  .sec-chip.filtered-out {
    color: transparent !important;
    background: rgba(0,0,0,.02) !important;
    box-shadow: inset -1px 0 0 rgba(0,0,0,.1), inset 0 -1px 0 rgba(0,0,0,.1) !important;
    pointer-events: none;
    cursor: default;
    filter: none !important;
  }
  .sheet {
    display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
    width: 100%;
    background: linear-gradient(160deg, #1a1d26 0%, #12141a 40%, #0e1016 100%);
    border: 1px solid #2c3040;
    border-radius: 14px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 -40px 80px rgba(0,0,0,.35),
      0 16px 48px rgba(0,0,0,.55);
    padding: 12px;
    box-sizing: border-box;
  }
  .tab-wrap { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; width: 100%; }
  .cover-board {
    display: flex; flex-direction: column; gap: 12px;
    align-items: stretch; width: 100%; order: -1;
  }
  .group {
    display: flex; flex-direction: row; flex-wrap: wrap;
    gap: 6px; align-items: flex-start; width: 100%;
  }
  .group.tall-head {
    display: grid;
    grid-template-columns: repeat(auto-fill, 150px);
    grid-auto-rows: 150px;
    gap: 6px;
    align-items: stretch;
  }
  .col-head {
    width: 150px; height: 150px; box-sizing: border-box;
    background: #050607; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 3rem; letter-spacing: .12em;
    border-radius: 8px; flex: 0 0 150px;
    box-shadow: 0 0 0 1px #22262f, 0 8px 20px rgba(0,0,0,.45);
    cursor: pointer; user-select: none;
  }
  .col-head:hover { filter: brightness(1.15); }
  .col-head.tall {
    grid-row: span 2;
    height: auto;
    width: 150px;
  }
  .col-body {
    display: contents;
  }
  .phrase {
    box-sizing: border-box; padding: 0; cursor: grab;
    border: 0; background: transparent; position: relative;
    perspective: 900px;
  }
  .phrase:active { cursor: grabbing; }
  .phrase.dragging { opacity: .4; }
  .phrase.dragging .card-inner { }
  .phrase img { pointer-events: none; display: block; }
  .card-inner {
    position: relative;
  }
  .phrase:not(.flipped) .card-inner {
    /* ref anchors to card */
  }
  .face {
    border-radius: 8px;
  }
  .face-tab { position: relative; }
  .face-cover {
    display: none;
    position: absolute; inset: 0;
    background: transparent;
    border-radius: 8px;
    overflow: hidden;
  }
  .phrase img.tab {
    width: auto; height: auto; max-width: none;
    background: #fff; image-rendering: crisp-edges;
    border-radius: 10px;
  }
  .phrase img.cover {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 8px; image-rendering: auto;
  }
  .phrase .ref {
    display: none;
    pointer-events: none;
    z-index: 2;
  }
  /* face-up (tab showing): ID top-left */
  .phrase:not(.flipped) .ref {
    display: block;
    position: absolute;
    top: 8px; left: 10px;
    margin: 0;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(0,0,0,.72);
    color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .04em;
    line-height: 1.15;
    white-space: nowrap;
  }
  .phrase.song-im:not(.flipped) .ref { background: rgba(220,100,20,.92); }
  .phrase.song-p:not(.flipped) .ref { background: rgba(200,30,40,.92); }
  .phrase.song-wp:not(.flipped) .ref { background: rgba(200,30,40,.92); }
  .phrase.song-lft:not(.flipped) .ref { background: rgba(40,140,210,.92); }
  .phrase.song-kytl:not(.flipped) .ref { background: rgba(140,60,190,.92); }
  .phrase.song-kytl2:not(.flipped) .ref { background: rgba(100,70,210,.92); }
  .phrase.song-other:not(.flipped) .ref { background: rgba(0,0,0,.72); }

  /* pedalboard glow on open tabs */
  .phrase:not(.flipped) .face-tab {
    border-radius: 10px;
    overflow: visible;
    background: transparent;
  }
  .phrase.a:not(.flipped) .face-tab {
    box-shadow:
      0 0 6px 1px rgba(163,73,164,.95),
      0 0 18px 4px rgba(163,73,164,.7),
      0 0 40px 10px rgba(163,73,164,.4);
  }
  .phrase.b:not(.flipped) .face-tab {
    box-shadow:
      0 0 6px 1px rgba(237,28,36,.95),
      0 0 18px 4px rgba(237,28,36,.7),
      0 0 40px 10px rgba(237,28,36,.4);
  }
  .phrase.c:not(.flipped) .face-tab {
    box-shadow:
      0 0 6px 1px rgba(255,210,40,.9),
      0 0 18px 4px rgba(255,210,40,.55),
      0 0 40px 10px rgba(255,210,40,.3);
  }
  .phrase.d:not(.flipped) .face-tab {
    box-shadow:
      0 0 6px 1px rgba(46,180,90,.95),
      0 0 18px 4px rgba(46,180,90,.7),
      0 0 40px 10px rgba(46,180,90,.4);
  }
  /* cover-up resting state: real album art, not the tab backface */
  .phrase.flipped {
    width: 150px; height: 150px;
    border-radius: 8px;
    background: transparent;
    overflow: hidden;
    box-shadow:
      0 0 10px 2px rgba(255,255,255,.08),
      0 8px 22px rgba(0,0,0,.65);
  }
  .phrase.a.flipped {
    box-shadow:
      0 0 8px 2px rgba(163,73,164,.55),
      0 0 22px 6px rgba(163,73,164,.28),
      0 8px 22px rgba(0,0,0,.65);
  }
  .phrase.b.flipped {
    box-shadow:
      0 0 8px 2px rgba(237,28,36,.55),
      0 0 22px 6px rgba(237,28,36,.28),
      0 8px 22px rgba(0,0,0,.65);
  }
  .phrase.d.flipped {
    box-shadow:
      0 0 8px 2px rgba(46,180,90,.55),
      0 0 22px 6px rgba(46,180,90,.28),
      0 8px 22px rgba(0,0,0,.65);
  }
  .phrase.flipped .card-inner {
    width: 100%; height: 100%;
    transform: none;
  }
  .phrase.flipped .face-tab { display: none; }
  .phrase.flipped .face-cover {
    display: block;
    position: absolute; inset: 0;
    transform: none;
    background: transparent;
  }
  .phrase.flipped img.cover {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }
  .phrase.flipped .ref {
    display: flex; align-items: center; justify-content: center;
    position: absolute; left: 0; right: 0; top: auto; bottom: 0;
    height: 48px; padding: 0 4px;
    background: rgba(0,0,0,.42); color: #fff;
    border-radius: 0 0 8px 8px;
    font-size: 22px; line-height: 1; letter-spacing: .04em;
    font-weight: 400;
    white-space: nowrap; overflow: hidden;
    pointer-events: none;
    max-width: none;
  }
  .phrase.a.flipped .ref {
    font-family: "SBS Title", "Metal Mania", cursive;
    font-size: 22px;
    color: #fff;
    background: rgba(0,0,0,.42);
  }
  .phrase.b.flipped .ref {
    font-family: "Paranoid Title", "Black Ops One", cursive;
    font-size: 20px;
    color: #fff;
    background: rgba(0,0,0,.42);
  }
  .phrase.d.flipped .ref {
    font-family: "Paranoid Title", "Black Ops One", cursive;
    font-size: 20px;
    color: #fff;
    background: rgba(0,0,0,.42);
  }
  .cover-board.shrunk .phrase.flipped {
    width: 75px; height: 75px;
  }
  .cover-board.shrunk .phrase.flipped img.cover {
    border-radius: 4px;
  }
  .cover-board.shrunk .phrase.flipped .face { border-radius: 4px; }
  .cover-board.shrunk .phrase.flipped .ref {
    height: 22px; padding: 0 2px; font-size: 10px;
    border-radius: 0 0 4px 4px;
    top: auto; left: 0; right: 0; bottom: 0;
  }
  .cover-board.shrunk .phrase.a.flipped .ref { font-size: 11px; }
  .cover-board.shrunk .phrase.b.flipped .ref { font-size: 9px; }
  .cover-board.shrunk .phrase.d.flipped .ref { font-size: 9px; }
  .cover-board.shrunk .col-head {
    width: 75px; height: 75px; flex-basis: 75px;
    font-size: 1.6rem; border-radius: 4px;
  }
  .cover-board.shrunk .group.tall-head {
    grid-template-columns: repeat(auto-fill, 75px);
    grid-auto-rows: 75px;
  }
  .cover-board.shrunk .col-head.tall {
    height: auto;
    width: 75px;
  }
  .lightbox {
    position: fixed; inset: 0; background: rgba(20,18,14,.82);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 20; cursor: zoom-out;
  }
  .lightbox img { max-width: 98vw; max-height: 94vh; background: #fff; border-radius: 4px; image-rendering: crisp-edges; }

  #sectionsSheet {
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    padding: 0 4px 8px !important;
  }
  /* Song lists + Excel-style grid; covers hug max chip column (Acrobat = 10) */
  .sections-wrap {
    --row-g: 28px;
    --name-w: 200px;
    --chip-w: 48px;
    --chip-h: 28px;
    --cols: 10;
    --cover-rows: 6;
    --cover: calc(var(--chip-h) * var(--cover-rows));
    --grid-left: calc(var(--row-g) + var(--name-w) + var(--cols) * var(--chip-w));
    width: 100%;
    max-width: calc(var(--row-g) + var(--name-w) + var(--cols) * var(--chip-w));
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .sec-head {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    height: 28px;
    min-height: 28px;
    margin: 0 0 2px;
    user-select: none;
    background: transparent;
  }
  .sec-head-label {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(0,0,0,.38);
    background: transparent;
    border: 0;
    padding: 0 10px;
  }
  .sec-head-label.song {
    flex: 0 0 calc(var(--row-g) + var(--name-w));
    width: calc(var(--row-g) + var(--name-w));
    min-width: calc(var(--row-g) + var(--name-w));
    max-width: calc(var(--row-g) + var(--name-w));
    justify-content: center;
  }
  .sec-head-label.section {
    flex: 0 0 calc(var(--cols) * var(--chip-w));
    width: calc(var(--cols) * var(--chip-w));
    min-width: calc(var(--cols) * var(--chip-w));
    max-width: calc(var(--cols) * var(--chip-w));
    justify-content: center;
  }
  .sec-head-label.album {
    flex: 0 0 calc(var(--cover) + 20px);
    width: calc(var(--cover) + 20px);
    min-width: calc(var(--cover) + 20px);
    max-width: calc(var(--cover) + 20px);
    justify-content: center;
  }
  .sec-ruler {
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    height: 20px;
    min-height: 20px;
    margin: 0 0 6px;
    user-select: none;
    background: transparent;
  }
  .row-num {
    flex: 0 0 var(--row-g);
    width: var(--row-g); min-width: var(--row-g); max-width: var(--row-g);
    height: var(--chip-h);
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: rgba(0,0,0,.28);
    background: transparent;
    border: 0;
  }
  .sec-ruler .row-num {
    height: 20px;
    background: transparent;
    color: transparent;
  }
  .sec-ruler .song-name {
    height: 20px; max-height: 20px; line-height: 20px;
    background: transparent !important;
    color: transparent;
    box-shadow: none !important;
    padding: 0 10px;
  }
  .sec-ruler .song-name::before,
  .sec-ruler .song-name::after { display: none !important; }
  .col-num {
    box-sizing: border-box;
    width: var(--chip-w); min-width: var(--chip-w); max-width: var(--chip-w);
    height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: rgba(0,0,0,.3);
    background: transparent;
    box-shadow: none;
  }
  .album-block {
    position: relative;
    width: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    overflow: visible;
    background: transparent;
    box-shadow: none;
    display: block;
  }
  .album-songs {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    min-width: 0;
  }
  /* Album art vertically centered in that album's song stack */
  .album-art-cell {
    position: absolute;
    top: 0;
    bottom: 0;
    left: var(--grid-left);
    width: calc(var(--cover) + 20px);
    height: auto;
    box-sizing: border-box;
    padding: 6px 8px;
    z-index: 2;
    background: transparent;
    border: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .album-art-cell .album-cover-end { pointer-events: auto; }
  .album-cover-end {
    position: static;
    display: block;
    width: auto;
    height: auto;
    max-width: calc(100% - 4px);
    max-height: calc(100% - 16px);
    aspect-ratio: 1 / 1;
    flex: 0 0 auto;
    object-fit: cover;
    object-position: center;
    background: #0a0a0a;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow:
      0 1px 2px rgba(0,0,0,.35),
      0 8px 24px rgba(0,0,0,.45),
      0 18px 40px rgba(0,0,0,.25);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .album-art-cell:hover .album-cover-end {
    transform: scale(1.03);
    box-shadow:
      0 2px 4px rgba(0,0,0,.4),
      0 12px 32px rgba(0,0,0,.5),
      0 24px 48px rgba(0,0,0,.3);
  }

  .song-row {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 0;
    margin: 0;
    padding: 0;
    height: var(--chip-h);
    min-height: var(--chip-h);
    max-height: var(--chip-h);
    background: none;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
  }
  .song-row:hover { background: rgba(112,48,160,.04); }
  .song-secs {
    display: flex; flex-wrap: nowrap; gap: 0; align-items: stretch;
    flex: 0 0 auto;
    min-width: 0;
    margin-left: 0;
  }
  .sec-chip {
    border: 0; cursor: pointer;
    box-sizing: border-box;
    width: var(--chip-w); min-width: var(--chip-w); max-width: var(--chip-w);
    height: var(--chip-h); min-height: var(--chip-h); max-height: var(--chip-h);
    padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 0;
    font-weight: 800; font-size: 0.8rem;
    letter-spacing: 0;
    color: #fff;
    background: #a064d0;
    box-shadow: inset -1px 0 0 rgba(0,0,0,.14), inset 0 -1px 0 rgba(0,0,0,.14);
  }
  .sec-chip:hover { filter: brightness(1.12); }
  .sec-chip:active { filter: brightness(.95); }
  /* legacy shade aliases → Excel tiers */
  .sec-chip.shade-0 { background: #7030a0; color: #fff; }
  .sec-chip.shade-1 { background: #a365d1; color: #fff; }
  .sec-chip.shade-2 { background: #bc90da; color: #1a1020; }
  .sec-chip.shade-3 { background: #d4bbe3; color: #1a1020; }
  .sec-chip.shade-4 { background: #f3edf7; color: #1a1020; }
  .sec-chip.S { color: #ffe44a !important; }
  .sec-chip.L { color: #7ec8ff !important; }
  /* Must follow .S/.L so filtered chips actually clear */
  .sec-chip.filtered-out,
  .sec-chip.filtered-out.S,
  .sec-chip.filtered-out.L,
  .sec-chip.S.filtered-out,
  .sec-chip.L.filtered-out {
    color: transparent !important;
    background: rgba(0,0,0,.02) !important;
    box-shadow: inset -1px 0 0 rgba(0,0,0,.1), inset 0 -1px 0 rgba(0,0,0,.1) !important;
    text-shadow: none !important;
    pointer-events: none;
    cursor: default;
    filter: none !important;
  }
  .sec-chip.empty {
    opacity: 1; cursor: default;
    background: rgba(0,0,0,.02) !important;
    color: transparent !important;
    box-shadow: inset -1px 0 0 rgba(0,0,0,.1), inset 0 -1px 0 rgba(0,0,0,.1) !important;
  }
  .sec-chip.empty:hover { filter: none; }
  .song-name {
    flex: 0 0 var(--name-w); width: var(--name-w); min-width: var(--name-w); max-width: var(--name-w);
    height: var(--chip-h); max-height: var(--chip-h);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-weight: 600; font-size: 0.88rem;
    letter-spacing: -0.015em;
    color: #16141a; margin: 0; line-height: var(--chip-h);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: linear-gradient(90deg, #f7f5f9 0%, #ffffff 70%);
    border-radius: 8px 0 0 8px;
    padding: 0 12px 0 10px;
    box-sizing: border-box;
    display: block;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.04);
  }
  .song-name::before { display: none !important; content: none !important; }
  .song-name::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 8px;
    bottom: 3px;
    height: 1px;
    background: linear-gradient(90deg, rgba(163,101,209,.35), rgba(163,101,209,0));
    pointer-events: none;
  }

  /* Album-tinted nameplates */
  .song-name.np-paranoid {
    background: linear-gradient(90deg, #f4f6f8 0%, #ffffff 75%);
    color: #14161a;
  }
  .song-name.np-paranoid::after {
    background: linear-gradient(90deg, rgba(90,106,120,.35), rgba(90,106,120,0));
  }
  .song-name.np-sbs {
    background: linear-gradient(90deg, #f3edf7 0%, #faf7fc 55%, #ffffff 100%);
    color: #1a1020;
  }
  .song-name.np-sbs::after {
    background: linear-gradient(90deg, rgba(112,48,160,.4), rgba(112,48,160,0));
  }
  .song-name.np-mor {
    background: linear-gradient(90deg, #f6f3ef 0%, #ffffff 75%);
    color: #1a1612;
  }
  .song-name.np-mor::after {
    background: linear-gradient(90deg, rgba(138,106,58,.35), rgba(138,106,58,0));
  }
  /* Excel fills ranked by darkness: T1 darkest → T5 near-white */
  .sec-chip.tier-1 { background: #7030a0; color: #fff; }
  .sec-chip.tier-2 { background: #a365d1; color: #fff; }
  .sec-chip.tier-3 { background: #bc90da; color: #1a1020; }
  .sec-chip.tier-4 { background: #d4bbe3; color: #1a1020; }
  .sec-chip.tier-5 { background: #f3edf7; color: #1a1020; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 100%; }
    .tile { padding: 16px 18px; border-radius: 12px; }
    .tile small { font-size: 0.75rem; }
    .keys { display: none; }
    .bar { flex-wrap: wrap; gap: 8px; }
    .sections-wrap {
      --row-g: 22px; --name-w: 140px; --chip-w: 30px; --chip-h: 20px; --cover-rows: 6; --cover: calc(var(--chip-h) * var(--cover-rows));
      max-width: 100%; gap: 0;
    }
    .song-name { flex: 0 0 var(--name-w); width: var(--name-w); min-width: var(--name-w); max-width: var(--name-w); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; }
    .sec-chip { width: var(--chip-w); min-width: var(--chip-w); max-width: var(--chip-w); height: var(--chip-h); min-height: var(--chip-h); font-size: 0.62rem; }
    .row-num { font-size: 0.58rem; }
    .col-num { font-size: 0.55rem; height: 18px; }
    .phrase { max-width: 100%; }
    .cover-board { gap: 8px; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 8px 6px 20px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { padding: 12px 14px; font-size: clamp(1.6rem, 12vw, 2.8rem); }
    .sections-wrap {
      --row-g: 20px; --name-w: 110px; --chip-w: 28px; --chip-h: 22px; --cover-rows: 4; --cover: calc(var(--chip-h) * var(--cover-rows));
    }
    .song-row {
      flex-wrap: nowrap;
      height: var(--chip-h);
      min-height: var(--chip-h);
      max-height: var(--chip-h);
      gap: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
      line-height: var(--chip-h);
    }
    .song-name {
      flex: 0 0 var(--name-w);
      width: var(--name-w); min-width: var(--name-w); max-width: var(--name-w);
      height: var(--chip-h); max-height: var(--chip-h);
      font-size: 0.75rem;
      line-height: var(--chip-h);
      padding: 0 6px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: #fff;
      z-index: 2;
      text-shadow: none;
    }
    .song-name { font-size: 0.78rem; font-weight: 600; }
    .song-secs {
      flex-wrap: nowrap;
      flex: 0 0 auto;
      overflow: visible;

    .sec-chip {

function loadAlbums() {
  try {
    var raw = localStorage.getItem(ALBUMS_KEY);
    var albums = (!raw) ? cloneAlbums(ALBUMS_DEFAULT) : JSON.parse(raw);
    if (!albums || !albums.length) albums = cloneAlbums(ALBUMS_DEFAULT);

      (a.songs||[]).forEach(function(s){
        if (s.song === "Into the Void") {
          var itvWant = [["I1",2,"ITV-I1"],["I2",3],["V1",1],["B1",3],["S1",1],["B2",1],["B3",1],["S2",1]];
          if (!s.sections) s.sections = [];
          var itvChips = 0;
          s.sections.forEach(function(p){ if (p && p[0]) itvChips++; });
          if (itvChips <= 1) {
            s.sections = itvWant.map(function(x){ return x.slice(); });
          } else {
            var has = s.sections.some(function(p){ return p && p[0]==="I1" && p[2]==="ITV-I1"; });
            if (!has) {
              var found=false;
              s.sections.forEach(function(p){ if(p && p[0]==="I1"){ p[1]=2; p[2]="ITV-I1"; found=true; }});
              if(!found) s.sections.unshift(["I1",2,"ITV-I1"]);
            }
          }
        }
        if (s.song === "War Pigs") {
          var links = { "I1": ["I1",2,"WP-I1"], "V1": ["V1",5,"WP-V1"], "V2": ["V2",2,"WP-V2"], "V3": ["V3",2,"WP-V3"], "V4": ["V4",2,"WP-V4"], "S1": ["S1",1,"WP-S1"] , "O1": ["O1",2,"WP-O1"] , "O2": ["O2",1,"WP-O2"] , "S2": ["S2",1,"WP-S2"] };
          if (!s.sections) s.sections = [];
          Object.keys(links).forEach(function(code){
            var want = links[code];
            var hit = null;
            s.sections.forEach(function(p){ if (isChipPair(p) && p[0] === code) hit = p; });
            if (hit) {
              if (hit[2] !== want[2]) { hit[1] = want[1]; hit[2] = want[2]; }
            } else if (!s.sections.length) {
              s.sections.push(want.slice());
            }
          });
        }
      });
    });
    try { localStorage.setItem(ALBUMS_KEY, JSON.stringify(albums)); } catch (err) {}
    return albums;
  } catch (e) {
    return cloneAlbums(ALBUMS_DEFAULT);
  }
}
function saveAlbums() {
  try { localStorage.setItem(ALBUMS_KEY, JSON.stringify(ALBUMS)); } catch (e) {}
}
var albumHistory = [];
var albumsDirty = false;
var saveStatusTimer = null;
function pushAlbumHistory() {
  try {
    albumHistory.push(cloneAlbums(ALBUMS));
    if (albumHistory.length > 40) albumHistory.shift();
  } catch (e) {}
  albumsDirty = true;
  updateEditSaveUi();
}
function undoAlbums() {

function setSaveStatus(msg) {
  var el = document.getElementById("secSaveStatus");
  if (!el) return;
  el.textContent = msg || "";
  if (saveStatusTimer) clearTimeout(saveStatusTimer);
  if (msg) {
    saveStatusTimer = setTimeout(function(){ el.textContent = ""; }, 1600);
  }
}
function updateEditSaveUi() {
  var tools = document.getElementById("secEditTools");
  var undoBtn = document.getElementById("secUndoBtn");
  var saveBtn = document.getElementById("secSaveBtn");
  if (tools) {
    if (sectionsMode === "edit") tools.removeAttribute("hidden");
    else tools.setAttribute("hidden", "");
  }
  if (undoBtn) undoBtn.disabled = !albumHistory.length;
  if (saveBtn) saveBtn.disabled = false;
}
function resetAlbumsToDefault() {
  ALBUMS = cloneAlbums(ALBUMS_DEFAULT);
  saveAlbums();
}
function secType(code) {
  if (!code) return "";
  var m = String(code).match(/^[A-Z]+/);
  return m ? m[0] : "";
}
var SONG_SLOTS = 10;
function isChipPair(pair) {
  return !!(pair && pair[0]);
}
function countSongChips(song) {
  var n = 0;
  (song.sections || []).forEach(function(pair){ if (isChipPair(pair)) n++; });
  return n;
}
/** Pack existing chips into a fixed 10-column slot grid (null = empty square). */
function ensureSongSlots(song) {
  if (!song) return;
  var slots = (typeof SONG_SLOTS === "number" && SONG_SLOTS > 0) ? SONG_SLOTS : 10;
  var src = song.sections || [];
  var out = [];
  var i;
  for (i = 0; i < slots; i++) out[i] = isChipPair(src[i]) ? src[i] : null;
  song.sections = out;
}
function ensureAllSongSlots(albums) {
  (albums || []).forEach(function(a){
    (a.songs || []).forEach(ensureSongSlots);
  });
}

function totalAlbumChips(albums) {
  var n = 0;
  (albums || []).forEach(function(a){
    (a.songs || []).forEach(function(s){ n += countSongChips(s); });
  });
  return n;
}
function repairAlbumsFromDefaults(albums) {
  var defaults = cloneAlbums(ALBUMS_DEFAULT);
  // Total wipe: restore everything from built-in defaults
  if (totalAlbumChips(albums) === 0) {
    albums.length = 0;
    defaults.forEach(function(a){ albums.push(a); });
    ensureAllSongSlots(albums);
    return defaults.reduce(function(n, a){ return n + (a.songs || []).length; }, 0) || 1;
  }
  var repaired = 0;
  (albums || []).forEach(function(a, ai){
    var da = null;
    for (var di = 0; di < defaults.length; di++) {
      if (defaults[di].name === a.name) { da = defaults[di]; break; }
    }
    if (!da) da = defaults[ai];
    if (!da) return;
    (a.songs || []).forEach(function(s, si){
      var ds = null;
      (da.songs || []).forEach(function(x){ if (x.song === s.song) ds = x; });
      if (!ds) ds = da.songs && da.songs[si];
      if (!ds) return;
      ensureSongSlots(s);
      var chips = countSongChips(s);
      var defN = 0;
      (ds.sections || []).forEach(function(pair){
        if (isChipPair(pair)) defN++;
      });
      if (chips === 0 && defN > 0) {
        s.sections = JSON.parse(JSON.stringify(ds.sections));
        ensureSongSlots(s);
        repaired++;
      }
    });
  });
  return repaired;
}
var ALBUMS = loadAlbums();
ensureAllSongSlots(ALBUMS);
if (repairAlbumsFromDefaults(ALBUMS) > 0 || totalAlbumChips(ALBUMS) === 0) {
  if (totalAlbumChips(ALBUMS) === 0) {
    ALBUMS = cloneAlbums(ALBUMS_DEFAULT);
  }
  ensureAllSongSlots(ALBUMS);

function showSections(keepScroll) {
  var sx = window.scrollX || window.pageXOffset || 0;

  var maxCols = 10;

  for (var c = 1; c <= maxCols; c++) colNums += '<span class="col-num">'+c+'</span>';
  var head = '<div class="sec-head"><div class="sec-head-label song">Song</div><div class="sec-head-label section">Section</div><div class="sec-head-label album">Album</div></div>';
  var ruler = '<div class="sec-ruler"><div class="row-num"></div><div class="song-name"></div><div class="song-secs">'+colNums+'</div></div>';
  var html = ALBUMS.map(function(album, ai){
    var rows = album.songs.map(function(s, si){
      rowN += 1;
      ensureSongSlots(s);
      n += countSongChips(s);
      var chipArr = [];
      for (var ci = 0; ci < maxCols; ci++) {
        var pair = s.sections[ci];
        if (!isChipPair(pair)) {
          chipArr.push('<button type="button" class="sec-chip empty" data-ai="'+ai+'" data-si="'+si+'" data-ci="'+ci+'" aria-label="Add section"></button>');
        } else {
          var code = pair[0], tier = pair[1], lick = pair[2] || "";
          var typ = secType(code);
          chipArr.push('<button type="button" class="sec-chip '+typ+' tier-'+tier+'" data-song="'+s.song+'" data-sec="'+code+'" data-type="'+typ+'" data-tier="'+tier+'" data-lick="'+lick+'" data-ai="'+ai+'" data-si="'+si+'" data-ci="'+ci+'">'+code+'</button>');
        }
      }
      var chips = chipArr.join("");
      var np = (album.font === 'font-sbs') ? 'np-sbs' : (album.font === 'font-mor') ? 'np-mor' : 'np-paranoid';
      var thumb = album.cover ? '<img class="song-thumb" src="'+album.cover+'" alt="">' : '';
      return '<div class="song-row" data-ai="'+ai+'" data-si="'+si+'"><div class="row-num">'+rowN+'</div><div class="song-name-wrap '+np+'-wrap">'+thumb+'<div class="song-name '+np+'">'+s.song+'</div></div><div class="song-secs">'+chips+'</div></div>';
    }).join("");
    return '<div class="album-block" data-ai="'+ai+'"><div class="album-songs">'+rows+'</div></div>';
  }).join("");
  document.getElementById("sectionsSheet").innerHTML = '<div class="sections-layout"><div class="sections-wrap">'+head+ruler+html+'</div></div>';
  document.getElementById("sectionsCount").textContent = n + " sections";
  buildSecFilters();
  applySecFilters();
  if (sectionsMode === "play") {
    pullPlayQueue();
    syncPlayChipClasses();
  }
  if (keepScroll) window.scrollTo(sx, sy);
  else window.scrollTo(0, 0);
  updateEditSaveUi();
}

var secTypeFilter = {};
var secTierFilter = {};
var secExcludeTypes = {};
var playQueue = [];
var PLAY_QUEUE_KEY = "lick-play-queue";
var playChannel = null;
try { playChannel = new BroadcastChannel("lick-play"); } catch (e) { playChannel = null; }
function isPlayboardPage() {
  return /(?:\?|&)playboard=1(?:&|$)/.test(location.search) || location.hash === "#playboard";
}
function publishPlayQueue() {
  try { localStorage.setItem(PLAY_QUEUE_KEY, JSON.stringify(playQueue)); } catch (e) {}
  if (playChannel) {
    try { playChannel.postMessage({ type: "queue", queue: playQueue }); } catch (e) {}
  }
}
function pullPlayQueue() {
  try {
    var raw = localStorage.getItem(PLAY_QUEUE_KEY);
    playQueue = raw ? (JSON.parse(raw) || []) : [];
  } catch (e) { playQueue = []; }
}
function openPlayWindow() {
  var base = location.href.split("?")[0].split("#")[0];
  var w = window.open(base + "?playboard=1", "lickPlayBoard");
  if (!w) {
    alert("Pop-up blocked — allow pop-ups so Playboard can open in another window.");

  }
  try { w.focus(); } catch (e) {}

}
function bindPlaySync() {
  if (playChannel) {
    playChannel.onmessage = function(ev){
      if (!ev || !ev.data || ev.data.type !== "queue") return;
      playQueue = ev.data.queue || [];
      if (isPlayboardPage()) {
        if (trimPlayQueueToFit()) publishPlayQueue();
        renderPlayBoard();
      } else syncAllPlaySelections();
    };
  }
  window.addEventListener("storage", function(ev){
    if (ev.key !== PLAY_QUEUE_KEY) return;
    pullPlayQueue();
    if (isPlayboardPage()) {
      if (trimPlayQueueToFit()) publishPlayQueue();
      renderPlayBoard();
    } else syncAllPlaySelections();
  });
}

function compactLibraryStrip(on) {
  var wrap = document.getElementById("tabWrap");
  if (!wrap) return;
  // Clear any old per-card hacks
  wrap.querySelectorAll(".phrase").forEach(function(el){
    el.style.transform = "";
    el.style.transformOrigin = "";
    el.style.marginRight = "";
    el.style.marginBottom = "";
  });
  if (!on) {
    wrap.style.transform = "";
    wrap.style.transformOrigin = "";
    wrap.style.width = "";
    wrap.style.marginBottom = "";
    return;
  }
  // Scale the whole strip as one unit so spacing stays even
  wrap.style.transform = "";
  wrap.style.marginBottom = "";
  wrap.style.width = "200%"; // wrap as if double-width, then scale to 50% => normal width
  wrap.style.transformOrigin = "top left";
  // force layout at 200% width
  var h = wrap.scrollHeight;
  wrap.style.transform = "scale(0.5)";
  wrap.style.marginBottom = (-Math.round(h / 2)) + "px";

function saveChipEditor() {

  var tierBtn = document.querySelector("#chipEditTiers .tier-pick.on");
  var tier = tierBtn ? parseInt(tierBtn.getAttribute("data-tier"),10) : (chipEditState.tier || 3);
  if (tier < 1 || tier > 5) tier = 3;
  var ai = chipEditState.ai, si = chipEditState.si, ci = chipEditState.ci;
  var song = ALBUMS[ai] && ALBUMS[ai].songs[si];
  if (!song) return;
  var lick = (document.getElementById("chipEditLick").value || "").trim();
  var entry = lick ? [code, tier, lick] : [code, tier];
  pushAlbumHistory();
  ensureSongSlots(song);
  if (chipEditState.isNew) {
    if (countSongChips(song) >= SONG_SLOTS) {
      alert("This song already has 10 chips.");
      return;
    }
    song.sections[ci] = entry;
  } else {
    song.sections[ci] = entry;
  }
  // Keep filters from hiding the chip you just saved
  var typ = secType(code);
  if (Object.keys(secTypeFilter).some(function(k){ return secTypeFilter[k]; })) {
    secTypeFilter[typ] = true;

  if (Object.keys(secTierFilter).some(function(k){ return secTierFilter[k]; })) {

function pasteSongSectionAt(ai, si, ci) {
  if (!sectionClipboard || !isChipPair(sectionClipboard)) return false;
  var song = ALBUMS[ai] && ALBUMS[ai].songs[si];
  if (!song) return false;
  ensureSongSlots(song);
  if (ci < 0 || ci >= SONG_SLOTS) return false;
  var dest = song.sections[ci];
  // Pasting into a different song that is already full (and target empty) is blocked
  var sameFocus = lastSectionFocus && lastSectionFocus.ai === ai && lastSectionFocus.si === si;
  if (!isChipPair(dest) && countSongChips(song) >= SONG_SLOTS) return false;
  pushAlbumHistory();
  song.sections[ci] = sectionClipboard.slice();
  saveAlbums();
  closeChipEditor();
  showSections(true);
  return true;
}

function rebuildColumns() {

  var hold = document.createDocumentFragment();
  a.concat(b, c, d).forEach(function(el){ hold.appendChild(el); });
  board.innerHTML = "";
  if (!a.length && !b.length && !c.length && !d.length) {
    board.className = "cover-board hidden";
    return;
  }
  // Jacob: flipped = tab (full size); unflipped = album art.
  // CSS .flipped = album art. When any tabs show, album-art tiles go to half (75px).
  var anyTab = !!document.querySelector("#tabWrap .phrase");
  board.className = anyTab ? "cover-board shrunk" : "cover-board";
  function cardsPerRow(cardSize) {
    var w = board.clientWidth || board.parentElement.clientWidth || window.innerWidth;
    var gap = 6;
    var cols = Math.max(1, Math.floor((w + gap) / (cardSize + gap)));
    return Math.max(1, cols - 1);
  }
  function addCols(items, label) {
    if (!items.length) return;

function moveSongMapChip(fromAi, fromSi, fromCi, toAi, toSi, toCi, copy) {
  var fromSong = ALBUMS[fromAi] && ALBUMS[fromAi].songs[fromSi];
  var toSong = ALBUMS[toAi] && ALBUMS[toAi].songs[toSi];
  if (!fromSong || !toSong) return false;
  ensureSongSlots(fromSong);
  ensureSongSlots(toSong);
  if (fromCi < 0 || fromCi >= SONG_SLOTS || toCi < 0 || toCi >= SONG_SLOTS) return false;
  if (fromAi === toAi && fromSi === toSi && fromCi === toCi) return false;
  var item = fromSong.sections[fromCi];
  if (!isChipPair(item)) return false;
  var dest = toSong.sections[toCi];
  // Cross-song into empty: need a free slot count
  if (!(fromAi === toAi && fromSi === toSi) && !isChipPair(dest) && countSongChips(toSong) >= SONG_SLOTS) return false;
  pushAlbumHistory();
  if (copy) {
    toSong.sections[toCi] = item.slice();
    saveAlbums();
    return true;
  }
  if (fromAi === toAi && fromSi === toSi) {
    if (isChipPair(dest)) {
      // Swap within the row (fixes adjacent / across-row moves)

      fromSong.sections[fromCi] = dest;
      fromSong.sections[toCi] = item;
    } else {
      // Move into an empty square (can leave a gap)
      fromSong.sections[fromCi] = null;
      fromSong.sections[toCi] = item;
    }
  } else if (isChipPair(dest)) {
    // Swap across songs
    fromSong.sections[fromCi] = dest;
    toSong.sections[toCi] = item;
  } else {
    fromSong.sections[fromCi] = null;
    toSong.sections[toCi] = item;
  }
  saveAlbums();
  return true;
}
function chipFromPoint(x, y) {

}
function endChipPointerDrag(cancelled) {
  document.removeEventListener("pointermove", onChipPointerMove);
  document.removeEventListener("pointerup", onChipPointerUp);
  document.removeEventListener("pointercancel", onChipPointerUp);
  if (!chipDrag) {
    pointerDragActive = false;
    return;
  }
  var over = chipDrag.over;
  var el = chipDrag.el;
  if (el) {
    el.classList.remove("dragging");
    el.style.visibility = "";
    try { if (chipDrag.pointerId != null) el.releasePointerCapture(chipDrag.pointerId); } catch (err) {}
  }
  clearChipDragOver();
  var moved = false;
  if (!cancelled && pointerDragActive && over && over !== el) {
    moved = finishChipMove(over);
  }
  if (!moved) {
    chipDrag = null;
    pointerDragActive = false;
  }
}
function finishChipMove(toChip) {
  if (!chipDrag || !toChip) return false;
  var toAi = parseInt(toChip.getAttribute("data-ai"), 10);
  var toSi = parseInt(toChip.getAttribute("data-si"), 10);
  var toCi = parseInt(toChip.getAttribute("data-ci"), 10);
  var ok = moveSongMapChip(chipDrag.ai, chipDrag.si, chipDrag.ci, toAi, toSi, toCi, !!chipDrag.copy);
  clearChipDragOver();
  if (chipDrag.el) {
    chipDrag.el.classList.remove("dragging");
    chipDrag.el.style.visibility = "";
  }
  chipDrag = null;
  pointerDragActive = false;
  didChipDrag = true;
  if (ok) showSections(true);
  return ok;
}
function onChipPointerMove(e) {
  if (!chipDrag || e.pointerId !== chipDrag.pointerId) return;
  if (sectionsMode !== "edit") { endChipPointerDrag(true); return; }
  var dx = e.clientX - chipDrag.startX;
  var dy = e.clientY - chipDrag.startY;
  if (!pointerDragActive) {
    if (Math.abs(dx) + Math.abs(dy) < 8) return;
    pointerDragActive = true;
    didChipDrag = true;
    if (chipDrag.el) {
      chipDrag.el.classList.add("dragging");
      try { chipDrag.el.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }
  e.preventDefault();
  clearChipDragOver();
  if (chipDrag.el) chipDrag.el.style.visibility = "hidden";
  var over = chipFromPoint(e.clientX, e.clientY);
  if (chipDrag.el) chipDrag.el.style.visibility = "";
  if (over && over !== chipDrag.el) {
    over.classList.add(over.classList.contains("empty") ? "drag-over-empty" : "drag-over");
    chipDrag.over = over;
  } else {
    chipDrag.over = null;
  }
}
function onChipPointerUp(e) {
  if (!chipDrag || e.pointerId !== chipDrag.pointerId) return;
  endChipPointerDrag(false);
}

    return;
  }
  document.getElementById("lb").innerHTML = '<img src="'+el.getAttribute("data-file")+'" alt="">';
  document.getElementById("lb").className = "lightbox";
};
document.getElementById("libPreviewBoard").onclick = function(e){
  var card = e.target.closest(".lib-preview-card");
  if (!card) return;
  var name = card.getAttribute("data-name") || "";
  var phrase = document.querySelector('.phrase[data-name="'+name+'"]');
  if (phrase) toggleLibraryPreview(phrase);
  else {
    libPreviewQueue = libPreviewQueue.filter(function(item){ return item.name !== name; });
    renderLibraryPreviewBoard();
  }
};
document.getElementById("lb").onclick = function(){ this.className = "lightbox hidden"; };

function isNumpadKey(e, digit) {
  // digit: "0"-"9". Handles NumLock on/off and location=NUMPAD.
  var codeMap = {
    "0": ["Numpad0"],
    "1": ["Numpad1"],
    "2": ["Numpad2"],
    "3": ["Numpad3"],
    "4": ["Numpad4"],
    "5": ["Numpad5"],
    "6": ["Numpad6"],
    "7": ["Numpad7"],
    "8": ["Numpad8"],
    "9": ["Numpad9"]
  };
  var codes = codeMap[digit] || [];
  if (codes.indexOf(e.code) >= 0) return true;
  if (e.location === 3 && String(e.key) === digit) return true;
  // NumLock off: Numpad0 often reports as Insert
  if (digit === "0" && e.location === 3 && (e.key === "Insert" || e.code === "Insert")) return true;
  if (digit === "0" && e.code === "Numpad0") return true;
  return false;
}
function goHomeKey(e) {
  return isNumpadKey(e, "0") || e.key === "Escape" || e.key === "Backspace" || e.key === "escape" || e.key === "backspace";
}
document.addEventListener("keydown", function(e){
  if ((e.metaKey || e.ctrlKey) && !e.altKey && document.body.classList.contains("sections-mode") && sectionsMode === "edit") {
    var tag0 = (e.target && e.target.tagName) || "";
    if (tag0 !== "INPUT" && tag0 !== "TEXTAREA") {
      var key = (e.key || "").toLowerCase();
      if (key === "z" && !e.shiftKey) { e.preventDefault(); undoAlbums(); return; }
      if (key === "s") { e.preventDefault(); saveAlbumsNow(); return; }
      if (key === "c") {
        e.preventDefault();
        if (chipEditState && !chipEditState.isNew) copySongSectionAt(chipEditState.ai, chipEditState.si, chipEditState.ci);
        else if (lastSectionFocus) copySongSectionAt(lastSectionFocus.ai, lastSectionFocus.si, lastSectionFocus.ci);
        return;
      }
      if (key === "v") {
        e.preventDefault();
        var dest = lastSectionFocus;
        if (chipEditState) dest = { ai: chipEditState.ai, si: chipEditState.si, ci: chipEditState.ci };
        if (dest) pasteSongSectionAt(dest.ai, dest.si, dest.ci);
        return;
      }
    }
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var lb = document.getElementById("lb");
  if (lb && !lb.classList.contains("hidden")) {
    if (e.key === "Escape" || isNumpadKey(e, "0")) lb.className = "lightbox hidden";
    return;
  }
  var k = e.key.toLowerCase();
  if (document.body.classList.contains("home-mode")) {
    if (isNumpadKey(e, "1")) { showSections(); return; }
    if (isNumpadKey(e, "2")) { showSeries("A"); return; }
    if (isNumpadKey(e, "3")) { showSeries("B"); return; }
    if (k === "a") showSeries("A");
    else if (k === "b") showSeries("B");
    else if (k === "c") showSeries("C");
    else if (k === "d") showSeries("D");
    return;
  }
  if (document.getElementById("chipEditor") && document.getElementById("chipEditor").classList.contains("open")) {
    if (k === "escape") { e.preventDefault(); closeChipEditor(); return; }
    return;
  }
  if (document.body.classList.contains("sections-mode")) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (isNumpadKey(e, "1")) { setSectionsMode("view"); return; }
    if (isNumpadKey(e, "2")) { setSectionsMode("edit"); return; }
    if (isNumpadKey(e, "3")) { setSectionsMode("play"); return; }
    if (e.shiftKey && k === "v") { setSectionsMode("view"); return; }
    if (e.shiftKey && k === "e") { setSectionsMode("edit"); return; }
    if (e.shiftKey && k === "p") { setSectionsMode("play"); return; }
    if (!e.shiftKey && (k === "i" || k === "v" || k === "c" || k === "b" || k === "s" || k === "l" || k === "o" || k === "f")) {
      toggleSecTypeKey(k);
      return;
    }
    if (!e.shiftKey && k === "p") {
      toggleSecTypeKey("PC");
      return;
    }
    if (e.code.indexOf("Digit") === 0 && k >= "1" && k <= "5") {
      toggleSecTierKey(parseInt(k, 10));
      return;
    }
    if (goHomeKey(e)) {
      if (k === "backspace") e.preventDefault();
      showHome();
    }
    return;
  }
  if (goHomeKey(e)) {
    if (k === "backspace") e.preventDefault();
    showHome();
    return;
  }
  if (k === "a" || k === "b" || k === "c" || k === "d") {
    revealKind(k.toUpperCase());
    return;
  }
  if (k >= "1" && k <= "9") {
    revealGroup(k);
  }
});

if (isPlayboardPage()) {
  initPlayboardPage();
} else {
  pullPlayQueue();
  bindPlaySync();
}
</script>
